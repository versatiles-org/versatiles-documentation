# Editorial input for scripts/build-dependency-graph.ts.
#
# The script can read manifests, but it cannot know what a repository is for,
# which Docker image is built where, or which of its findings are noise. That
# knowledge lives here.
#
# Every repository name below is checked against the organisation on each run,
# so a rename or a deletion is reported instead of silently doing nothing.

org: versatiles-org

# Archived repositories describe the past, not the current stack.
include_archived: false
# Forks are kept: the tile pipelines genuinely build on them.
include_forks: true

# How much a repository matters to someone arriving from outside. The question
# these answer is "do I need to care about this?", not "what kind of code is
# it?" — so the order runs from what VersaTiles cannot do without to what only
# its maintainers ever touch, and that is the order they are presented in.
#
# `hue` is the oklch hue angle the tag is drawn in (25 is red, 145 green); a tag
# without one is drawn grey, which is what recedes.
#
# A repository may carry more than one tag where that is genuinely true; the
# first one is the primary one and decides the colour in the graph and the
# section of the table it is listed under.
tags:
  - id: core
    title: Core
    hue: 25
    summary: What VersaTiles cannot do without — the container format, the software that reads and serves it, and the styles, fonts and frontend that turn tiles into a map.

  - id: tools
    title: Tools
    hue: 85
    summary: Optional extras built on top of the core — libraries, editors, renderers and alternative servers for developers who want more than a basemap.

  - id: tile-production
    title: Tile production
    hue: 145
    summary: Pipelines that turn open data into the tilesets VersaTiles publishes. Needed only to build tiles rather than download them.

  - id: ecosystem
    title: Ecosystem
    hue: 250
    summary: What surrounds the software — documentation, the websites, the public tile and download servers, and the packages it is installed from.

  - id: internal
    title: Internal helpers
    summary: Housekeeping for the maintainers. Nothing here is needed to use VersaTiles.

# Every public repository, and where it belongs. Anything not named here still
# appears, but uncategorised — which is the reminder to come back and place it.
repositories:
  'node-versatiles-container': [core]
  'versatiles-fonts': [core]
  'versatiles-frontend': [core]
  'versatiles-glyphs-rs': [core]
  'versatiles-rs': [core]
  'versatiles-spec': [core]
  'versatiles-style': [core]

  'maplibre-versatiles-styler': [tools]
  'node-versatiles-google-cloud': [tools]
  'node-versatiles-server': [tools]
  'node-versatiles-svelte': [tools]
  'photon-stack': [tools]
  'versatiles-choro': [tools]
  'versatiles-map-animation': [tools]
  'versatiles-map-editor': [tools]
  'versatiles-studio': [tools]
  'versatiles-svg-renderer': [tools]

  'elevation': [tile-production]
  'landcover-vectors': [tile-production]
  'opendem-gebco-bathymetry': [tile-production]
  'orthophotos': [tile-production]
  'planetiler-shortbread': [tile-production]
  'planetiler': [tile-production]
  'shortbread-tilemaker': [tile-production]

  '.github': [ecosystem]
  'consortium': [ecosystem]
  'download.versatiles.org': [ecosystem]
  'editor': [ecosystem]
  'homebrew-versatiles': [ecosystem]
  'maputnik': [ecosystem]
  'playground': [ecosystem]
  'shortbread-docs': [ecosystem]
  'tiles.versatiles.org': [ecosystem]
  'tools': [ecosystem]
  'versatiles-docker': [ecosystem]
  'versatiles-documentation': [ecosystem]
  'versatiles-org.github.io': [ecosystem]

  'node-release-tool': [internal]

# Container images published by the project, and the repository that builds
# them. Image names carry no hint of their origin, so this mapping is the only
# way to turn a `FROM` line into an arrow. Unmapped images that look like ours
# are reported as a warning.
images:
  versatiles/versatiles: versatiles-docker
  versatiles/versatiles-frontend: versatiles-docker
  versatiles/versatiles-gdal: versatiles-docker
  versatiles/versatiles-nginx: versatiles-docker
  versatiles/versatiles-planetiler: versatiles-docker
  versatiles/versatiles-tilemaker: versatiles-docker
  versatiles/versatiles-tippecanoe: versatiles-docker
  ghcr.io/versatiles-org/versatiles: versatiles-docker
  ghcr.io/versatiles-org/versatiles-frontend: versatiles-docker
  ghcr.io/versatiles-org/versatiles-gdal: versatiles-docker
  ghcr.io/versatiles-org/versatiles-nginx: versatiles-docker
  ghcr.io/versatiles-org/versatiles-planetiler: versatiles-docker
  ghcr.io/versatiles-org/versatiles-tilemaker: versatiles-docker
  ghcr.io/versatiles-org/versatiles-tippecanoe: versatiles-docker
  ghcr.io/versatiles-org/versatiles-choro: versatiles-choro
  ghcr.io/versatiles-org/versatiles-map-animation: versatiles-map-animation
  ghcr.io/versatiles-org/planetiler-shortbread: planetiler-shortbread

# Repositories left out of the graph entirely.
exclude: []

# Dependencies no parser can see: data handed over between pipelines, services
# that expect a particular tileset, agreements that only exist in a runbook.
# Each needs a note, which is shown instead of a source link.
#
#   - from: tiles.versatiles.org
#     to: planetiler-shortbread
#     kind: manual
#     note: serves the OSM tilesets produced by this pipeline
manual:
  # The tile pipelines call an installed `versatiles` binary. Nothing declares
  # that: there is no manifest entry for a program expected on the PATH.
  - from: elevation
    to: versatiles-rs
    kind: manual
    note: runs the versatiles CLI to convert and merge the elevation tiles
  - from: landcover-vectors
    to: versatiles-rs
    kind: manual
    note: runs the versatiles CLI to assemble and merge the landcover tiles
  - from: opendem-gebco-bathymetry
    to: versatiles-rs
    kind: manual
    note: runs the versatiles CLI to pack the bathymetry tiles into a container

  # Fetched from the published site, so no repository name appears in the code.
  - from: playground
    to: versatiles-org.github.io
    kind: manual
    note: builds every example page from the template at versatiles.org/playground.html

  # photon-stack is the geocoder behind geocode.versatiles.org. Other hosted
  # services are deliberately not listed — nearly everything loads tiles from
  # tiles.versatiles.org — but without these the geocoder would look unused.
  - from: versatiles-frontend
    to: photon-stack
    kind: manual
    note: the search box queries geocode.versatiles.org, which this stack serves
  - from: versatiles-map-editor
    to: photon-stack
    kind: manual
    note: the place search queries geocode.versatiles.org, which this stack serves
  - from: playground
    to: photon-stack
    kind: manual
    note: the geocoder example queries geocode.versatiles.org, which this stack serves

# False positives. A rule that stops matching is reported, so this list cannot
# quietly outlive the problem it was written for.
ignore: []
