name: Dependency Graph

# The dependency graph describes the whole organisation, so it goes stale
# whenever any *other* repository changes — something the CI of this repository
# never notices. This job therefore rebuilds it on a schedule, verifies that the
# site still builds, and commits the result.

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: dependency-graph
  cancel-in-progress: false

jobs:
  update:
    name: Update
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Needed to start the CI workflow below.
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Rebuild the dependency graph
        run: npm run sync:deps
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A generated page can break the site — a malformed diagram, a dead link.
      # Building before committing keeps that out of main.
      - name: Build
        run: npm run build

      - name: Commit and push
        id: commit
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          if [ -z "$(git status --porcelain compendium/dependency_graph.md public/dependency-graph.json)" ]; then
            echo "no changes"
            echo "changed=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          git add compendium/dependency_graph.md public/dependency-graph.json
          git commit -m 'update repository dependency graph'
          git push
          echo "changed=true" >>"$GITHUB_OUTPUT"
        shell: bash

      # GitHub deliberately does not start workflows for pushes made with
      # GITHUB_TOKEN, so the deployment has to be asked for explicitly.
      - name: Publish the updated page
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run ci.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
